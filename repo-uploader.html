<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>仓库直传</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --paper:#f6f5f1;
    --ink:#1c211d;
    --ink-soft:#5a6058;
    --line:#dcdad2;
    --teal:#2f6f62;
    --teal-deep:#204b42;
    --amber:#c9852c;
    --danger:#b3452f;
    --ok:#2f6f62;
    --card:#ffffff;
    --radius:14px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171a;
      --ink:#e9ece7;
      --ink-soft:#9aa39a;
      --line:#2b302c;
      --card:#1c2023;
      --teal:#5fa393;
      --teal-deep:#8ec4b6;
      --amber:#e0a559;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171a;
    --ink:#e9ece7;
    --ink-soft:#9aa39a;
    --line:#2b302c;
    --card:#1c2023;
    --teal:#5fa393;
    --teal-deep:#8ec4b6;
    --amber:#e0a559;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:24px 18px 40px;
  }
  header{
    padding-top: env(safe-area-inset-top, 0px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  h1{
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.02em;
    margin:0;
  }
  .repo-tag{
    font-size:16px;
    font-weight:700;
    color:var(--teal-deep);
    cursor:pointer;
    background:color-mix(in srgb, var(--teal) 16%, var(--card));
    border:1.5px solid var(--teal);
    border-radius:999px;
    padding:7px 14px;
    font-family:inherit;
    max-width:62%;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }
  .drop{
    border:1.5px dashed var(--line);
    border-radius:var(--radius);
    padding:38px 18px;
    text-align:center;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .drop:active, .drop.hover{
    border-color:var(--teal);
    background:color-mix(in srgb, var(--teal) 6%, transparent);
  }
  .drop .big{
    font-size:17px;
    font-weight:600;
    margin-bottom:6px;
  }
  .drop .small{
    font-size:13px;
    color:var(--ink-soft);
  }
  input[type=file]{display:none;}
  label.field{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 5px;
  }
  input[type=text], input[type=password]{
    width:100%;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--ink);
    font-size:14px;
    margin-bottom:14px;
  }
  input[type=text]:focus, input[type=password]:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  button.primary{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:13px;
    border-radius:9px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  button.primary:active{background:var(--teal-deep);}
  button.ghost{
    width:100%;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-soft);
    padding:10px;
    border-radius:9px;
    font-size:13px;
    margin-top:8px;
    cursor:pointer;
  }
  .status-line{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:16px;
  }
  .log{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .log-item{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:13px;
    background:var(--paper);
  }
  .log-item .icon{
    flex:0 0 auto;
    width:18px;
    text-align:center;
    line-height:1.4;
  }
  .log-item .body{flex:1; min-width:0;}
  .log-item .path{
    word-break:break-all;
    font-size:12.5px;
  }
  .log-item .note{
    color:var(--ink-soft);
    font-size:11.5px;
    margin-top:2px;
  }
  .log-item.ok{border-color:color-mix(in srgb, var(--ok) 40%, var(--line));}
  .log-item.err{border-color:color-mix(in srgb, var(--danger) 45%, var(--line));}
  .log-item.pending{opacity:.6;}
  /* 批量上传完成的汇总条：和单个文件的记录区分开 */
  .log-item.summary{
    align-items:center;
    gap:12px;
    padding:16px 14px;
    border-width:2px;
    border-radius:12px;
    background:color-mix(in srgb, var(--teal) 16%, var(--card));
    border-color:var(--teal);
  }
  .log-item.summary.err{
    background:color-mix(in srgb, var(--danger) 14%, var(--card));
    border-color:var(--danger);
  }
  .log-item.summary .icon{font-size:24px; width:28px; line-height:1;}
  .log-item.summary .path{font-size:13px; color:var(--ink-soft);}
  .log-item.summary .note{
    font-size:16px;
    font-weight:700;
    margin-top:4px;
    color:var(--teal-deep);
  }
  .log-item.summary.err .note{color:var(--danger);}
  .log-item.needs-action{
    opacity:1;
    border:2px solid var(--amber);
    background:color-mix(in srgb, var(--amber) 12%, var(--card));
  }
  .action-tag{
    font-size:14px;
    font-weight:700;
    color:var(--amber);
    margin-bottom:8px;
  }
  .needs-action .path-select, .needs-action input.path-input{
    font-size:15px;
    border:2px solid var(--amber);
  }
  .needs-action .confirm-btn{
    padding:13px;
    font-size:15px;
  }
  .ambiguous{
    margin-top:10px;
  }
  select.path-select, input.path-input{
    width:100%;
    padding:10px 11px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    margin-bottom:8px;
  }
  select.path-select:focus, input.path-input:focus{
    outline:2px solid var(--teal);
    outline-offset:1px;
  }
  button.confirm-btn{
    width:100%;
    background:var(--teal);
    color:#fff;
    border:none;
    padding:9px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  button.confirm-btn:active{background:var(--teal-deep);}
  button.confirm-btn:disabled{background:var(--line); color:var(--ink-soft); cursor:not-allowed;}
  .hidden{display:none !important;}
  .empty-hint{
    font-size:13px;
    color:var(--ink-soft);
    text-align:center;
    padding:20px 0;
  }
  .section-title{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 10px;
  }
  .zip-target-list{
    max-height:220px;
    overflow-y:auto;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    margin:6px 0;
    background:var(--paper);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>仓库直传</h1>
    <button class="repo-tag" id="repoTag" onclick="showSettings()">未连接仓库</button>
  </header>

  <!-- 设置面板 -->
  <div class="card" id="settingsCard">
    <p class="section-title">连接一个仓库（信息只保存在本机浏览器）</p>
    <label class="field">Personal Access Token</label>
    <input type="password" id="inToken" placeholder="github_pat_ 或 ghp_ 开头">
    <label class="field">仓库（owner/repo）</label>
    <input type="text" id="inRepo" placeholder="leitian2026/-2026">
    <button class="ghost" onclick="browseRepos()" style="margin:-6px 0 14px;">浏览我的仓库</button>
    <div class="log" id="repoList" style="margin-bottom:14px;"></div>
    <label class="field">分支</label>
    <input type="text" id="inBranch" placeholder="main" value="main">
    <button class="primary" onclick="saveSettings()">连接并读取仓库结构</button>
    <div class="status-line" id="settingsStatus"></div>
  </div>

  <!-- 上传区 -->
  <div class="card hidden" id="uploadCard">
    <div class="drop" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="big">选择文件上传</div>
      <div class="small">支持任意文件、任意数量，压缩包会自动展开；也可以直接拖进来（支持同时拖多个文件夹），或用下方按钮选整个文件夹</div>
    </div>
    <input type="file" id="fileInput" multiple>
    <button class="ghost" onclick="document.getElementById('folderInput').click()">选择整个文件夹上传（保留目录结构）</button>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    <div class="status-line" id="uploadStatus"></div>
    <button class="ghost" onclick="refreshTree()">重新读取仓库结构</button>
  </div>

  <!-- 日志 -->
  <div class="card hidden" id="logCard">
    <p class="section-title">上传记录</p>
    <div class="log" id="log"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let state = {
  token:'', owner:'', repo:'', branch:'main',
  pathSet:new Set(),          // 仓库里已存在的完整路径
  pathShaMap:new Map(),       // path -> sha
  basenameMap:new Map(),      // 文件名(不含目录) -> [完整路径,...]
  activeUploads:0,            // 正在进行中的上传请求数（用于刷新前警告）
};

function getLastDir(){
  try{ return localStorage.getItem('repoUploaderLastDir') || ''; }catch(e){ return ''; }
}
function setLastDir(dir){
  try{ if(dir) localStorage.setItem('repoUploaderLastDir', dir); }catch(e){}
}

function getPick(base){
  try{ const m = JSON.parse(localStorage.getItem('repoUploaderPicks') || '{}'); return m[base] || ''; }catch(e){ return ''; }
}
function setPick(base, path){
  try{
    const m = JSON.parse(localStorage.getItem('repoUploaderPicks') || '{}');
    m[base] = path;
    localStorage.setItem('repoUploaderPicks', JSON.stringify(m));
  }catch(e){}
}

// ---- 防传错仓库的辅助函数 ----
// 当前连接的仓库快照：预览卡片创建时记一份，确认上传时比对，
// 避免"先拖进文件、再切换仓库、然后确认"把文件传到新仓库。
function snapshotRepo(){
  return {owner: state.owner, repo: state.repo, branch: state.branch};
}
function sameRepo(snap){
  return !!snap && snap.owner === state.owner && snap.repo === state.repo && snap.branch === state.branch;
}
// 每个仓库按名字固定一个颜色：顶部标签和预览卡片左边框用同一种颜色，一眼分辨
function repoColor(full){
  let h = 0;
  for(const ch of String(full).toLowerCase()){ h = (h * 31 + ch.charCodeAt(0)) >>> 0; }
  return `hsl(${h % 360}, 58%, 46%)`;
}
function repoBannerHtml(snap){
  const name = `${snap.owner}/${snap.repo}`;
  const c = repoColor(name);
  return `<div class="repo-banner" style="margin:6px 0;padding:7px 10px;border-left:5px solid ${c};border-radius:6px;background:color-mix(in srgb, ${c} 12%, var(--card));font-size:13px;">将上传到 <b class="mono">${escapeHtml(name)}</b> · 分支 <span class="mono">${escapeHtml(snap.branch)}</span></div>`;
}
// 记住"压缩包/文件夹名 → 上次传到的仓库"
function getZipRepo(name){
  try{ const m = JSON.parse(localStorage.getItem('repoUploaderZipRepos') || '{}'); return m[name] || ''; }catch(e){ return ''; }
}
function setZipRepo(name, repoName){
  try{
    const m = JSON.parse(localStorage.getItem('repoUploaderZipRepos') || '{}');
    m[name] = repoName;
    localStorage.setItem('repoUploaderZipRepos', JSON.stringify(m));
  }catch(e){}
}
// 切换仓库后，之前还没确认的卡片（路径是按旧仓库算的）全部作废
function invalidatePendingCards(){
  const cards = document.querySelectorAll('#log .log-item.needs-action');
  if(!cards.length) return;
  const n = cards.length;
  cards.forEach(c => c.remove());
  addLogItem('sw'+Math.random(), '已切换仓库', `有 ${n} 张待确认的卡片已作废（路径是按上一个仓库算的），请重新选择文件`, 'err');
}
// 压缩包路径和当前仓库已有路径的重合情况（去掉外壳文件夹前后取较大值）
function computeOverlap(items, singleTop){
  const prefix = singleTop ? singleTop + '/' : null;
  let total = 0, asIs = 0, stripped = 0, nameMatch = 0, nameExample = '';
  for(const i of items){
    if(HEAVY_DIR_PATTERN.test(i.name)) continue;
    total++;
    if(state.pathSet.has(i.name)) asIs++;
    if(prefix){
      const s = i.name.slice(prefix.length);
      if(s && state.pathSet.has(s)) stripped++;
    }
    // 路径对不上时，看文件名能不能对上（README、build.gradle 这类到处都有的通用文件名不算）
    const base = i.name.split('/').pop();
    if(!ROOT_MARKER_PATTERN.test(base) && state.basenameMap.has(base)){
      nameMatch++;
      if(!nameExample) nameExample = `${base} → ${state.basenameMap.get(base)[0]}`;
    }
  }
  return {total, best: Math.max(asIs, stripped), nameMatch, nameExample};
}

function loadSettings(){
  try{
    const raw = localStorage.getItem('repoUploaderCfg');
    if(!raw) return false;
    const cfg = JSON.parse(raw);
    state.token = cfg.token||''; state.owner = cfg.owner||''; state.repo = cfg.repo||''; state.branch = cfg.branch||'main';
    return !!(state.token && state.owner && state.repo);
  }catch(e){ return false; }
}
function persistSettings(){
  try{
    localStorage.setItem('repoUploaderCfg', JSON.stringify({token:state.token, owner:state.owner, repo:state.repo, branch:state.branch}));
  }catch(e){}
}

function showSettings(){
  $('settingsCard').classList.remove('hidden');
  $('inToken').value = state.token;
  $('inRepo').value = state.owner && state.repo ? `${state.owner}/${state.repo}` : '';
  $('inBranch').value = state.branch || 'main';
}

async function browseRepos(){
  const token = $('inToken').value.trim();
  const listEl = $('repoList');
  if(!token){
    listEl.innerHTML = '<div class="log-item err"><div class="icon">❌</div><div class="body"><div class="note">先填 Token 再浏览仓库</div></div></div>';
    return;
  }
  listEl.innerHTML = '<div class="log-item pending"><div class="icon">⏳</div><div class="body"><div class="note">正在读取仓库列表…</div></div></div>';
  try{
    const res = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated&affiliation=owner,collaborator,organization_member', {
      headers:{'Authorization': `token ${token}`, 'Accept':'application/vnd.github+json'}
    });
    if(!res.ok) throw new Error(res.status + ' ' + res.statusText);
    const repos = await res.json();
    if(!Array.isArray(repos) || repos.length === 0){
      listEl.innerHTML = '<div class="log-item err"><div class="icon">❌</div><div class="body"><div class="note">没有读取到仓库，检查 token 权限</div></div></div>';
      return;
    }
    listEl.innerHTML = '';
    repos.forEach(r=>{
      const el = document.createElement('div');
      el.className = 'log-item ok';
      el.style.cursor = 'pointer';
      el.innerHTML = `<div class="icon">${r.private?'🔒':'📦'}</div><div class="body"><div class="path mono">${escapeHtml(r.full_name)}</div><div class="note">默认分支 ${escapeHtml(r.default_branch||'main')}</div></div>`;
      el.onclick = ()=>{
        $('inRepo').value = r.full_name;
        $('inBranch').value = r.default_branch || 'main';
        listEl.innerHTML = '';
      };
      listEl.appendChild(el);
    });
  }catch(e){
    listEl.innerHTML = `<div class="log-item err"><div class="icon">❌</div><div class="body"><div class="note">读取失败：${escapeHtml(e.message)}</div></div></div>`;
  }
}

async function saveSettings(){
  const token = $('inToken').value.trim();
  const repoFull = $('inRepo').value.trim();
  const branch = $('inBranch').value.trim() || 'main';
  const statusEl = $('settingsStatus');
  if(!token || !repoFull.includes('/')){
    statusEl.textContent = '请填写 Token，以及 owner/repo 格式的仓库名';
    statusEl.style.color = 'var(--danger)';
    return;
  }
  const [owner, repo] = repoFull.split('/');
  const switched = !!state.owner && (state.owner !== owner || state.repo !== repo || state.branch !== branch);
  state.token = token; state.owner = owner; state.repo = repo; state.branch = branch;
  if(switched) invalidatePendingCards();
  statusEl.style.color = 'var(--ink-soft)';
  statusEl.textContent = '正在连接…';
  try{
    await fetchTree();
    persistSettings();
    statusEl.textContent = '';
    $('settingsCard').classList.add('hidden');
    $('uploadCard').classList.remove('hidden');
    $('logCard').classList.remove('hidden');
    updateRepoTag();
  }catch(e){
    statusEl.textContent = '连接失败：' + e.message;
    statusEl.style.color = 'var(--danger)';
  }
}

function updateRepoTag(){
  const tag = $('repoTag');
  tag.textContent = `${state.owner}/${state.repo} · ${state.branch}`;
  const c = repoColor(`${state.owner}/${state.repo}`);
  tag.style.borderColor = c;
  tag.style.color = c;
  tag.style.background = `color-mix(in srgb, ${c} 14%, var(--card))`;
}

async function ghFetch(url, options={}){
  // 20秒超时保护：网络卡住/断网时不会无限转圈，会明确报错而不是假死
  const controller = new AbortController();
  const timeoutId = setTimeout(()=>controller.abort(), 20000);
  let res;
  try{
    res = await fetch(url, {
      ...options,
      signal: controller.signal,
      headers:{
        'Authorization': `token ${state.token}`,
        'Accept':'application/vnd.github+json',
        ...(options.headers||{})
      }
    });
  }catch(e){
    if(e.name === 'AbortError'){
      throw new Error('网络请求超时（20秒无响应，可能是断网了），请检查网络后重试');
    }
    throw new Error('网络请求失败（可能是断网了）：' + e.message);
  }finally{
    clearTimeout(timeoutId);
  }
  if(!res.ok){
    let msg = res.status + ' ' + res.statusText;
    try{ const j = await res.json(); if(j.message) msg = j.message; }catch(e){}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res.json();
}

// 计算内容对应的 git blob sha1（和 GitHub 返回的 blob sha 是同一种算法），
// 用来判断"要上传的内容"和"仓库里已有的内容"是否完全一样。
// 用途：断网/刷新页面后重新选中同一批文件重试时，内容没变的文件会
// 自动跳过，不会重复占用一次 API 调用，也不会因为重复提交而困惑。
async function gitBlobSha1(arrayBuffer){
  const header = new TextEncoder().encode(`blob ${arrayBuffer.byteLength}\0`);
  const combined = new Uint8Array(header.byteLength + arrayBuffer.byteLength);
  combined.set(header, 0);
  combined.set(new Uint8Array(arrayBuffer), header.byteLength);
  const hashBuf = await crypto.subtle.digest('SHA-1', combined);
  return Array.from(new Uint8Array(hashBuf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

async function fetchTree(){
  state.pathSet = new Set();
  state.pathShaMap = new Map();
  state.basenameMap = new Map();
  let data;
  try{
    data = await ghFetch(`https://api.github.com/repos/${state.owner}/${state.repo}/git/trees/${encodeURIComponent(state.branch)}?recursive=1`);
  }catch(e){
    if(e.status === 409 && /empty/i.test(e.message)){
      // 全新仓库，一个提交都没有：当作零文件处理，不算连接失败
      return;
    }
    throw e;
  }
  (data.tree||[]).forEach(item=>{
    if(item.type !== 'blob') return;
    state.pathSet.add(item.path);
    state.pathShaMap.set(item.path, item.sha);
    const base = item.path.split('/').pop();
    if(!state.basenameMap.has(base)) state.basenameMap.set(base, []);
    state.basenameMap.get(base).push(item.path);
  });
}

async function refreshTree(){
  $('uploadStatus').textContent = '正在重新读取仓库结构…';
  try{
    await fetchTree();
    $('uploadStatus').textContent = `已读取，仓库共有 ${state.pathSet.size} 个文件`;
  }catch(e){
    $('uploadStatus').textContent = '读取失败：' + e.message;
  }
}

// ---- 路径匹配 ----
function resolveTarget(literalRelPath, baseName){
  if(literalRelPath && state.pathSet.has(literalRelPath)){
    return {type:'exact', path: literalRelPath};
  }
  const matches = state.basenameMap.get(baseName) || [];
  if(matches.length === 1){
    return {type:'byname', path: matches[0]};
  }
  if(matches.length === 0){
    // 全新文件：不再默认扔到仓库根目录——如果之前上传过新文件，
    // 优先建议用同一个目录，减少每次都要手动补目录前缀的麻烦
    // （仍然是可编辑的建议值，不会未经确认就真的传到那里）。
    const lastDir = getLastDir();
    const suggested = literalRelPath || (lastDir ? `${lastDir}/${baseName}` : baseName);
    return {type:'new', path: suggested};
  }
  return {type:'ambiguous', candidates: matches, fallback: literalRelPath || baseName};
}

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  }
  return btoa(binary);
}

// ---- 日志 UI ----
function addLogItem(id, path, statusText, cls, extra){
  const el = document.createElement('div');
  el.className = 'log-item ' + cls + (extra ? ' ' + extra : '');
  el.id = 'log-' + id;
  el.innerHTML = `<div class="icon">${cls==='ok'?'✅':cls==='err'?'❌':'⏳'}</div>
    <div class="body"><div class="path mono">${escapeHtml(path)}</div><div class="note">${escapeHtml(statusText)}</div></div>`;
  $('log').prepend(el);
  return el;
}
function updateLogItem(el, statusText, cls){
  el.className = 'log-item ' + cls;
  el.querySelector('.icon').textContent = cls==='ok'?'✅':cls==='err'?'❌':'⏳';
  el.querySelector('.note').textContent = statusText;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- 上传核心 ----
async function uploadOne(path, arrayBuffer, noteExtra){
  const id = 'u' + Math.random().toString(36).slice(2);
  const el = addLogItem(id, path, noteExtra ? noteExtra + ' · 上传中…' : '上传中…', 'pending');
  state.activeUploads++;
  try{
    const sha = state.pathShaMap.get(path);
    if(sha){
      // 目标路径已有文件：先比对内容是否完全一样，一样就跳过，不重复提交
      try{
        const localSha = await gitBlobSha1(arrayBuffer);
        if(localSha === sha){
          updateLogItem(el, (noteExtra?noteExtra+' · ':'') + '内容和仓库里的完全一样，已跳过', 'ok');
          return true;
        }
      }catch(hashErr){
        // 哈希算不出来（极少见）就不影响主流程，继续正常上传
      }
    }
    const body = {
      message: `上传 ${path}`,
      content: arrayBufferToBase64(arrayBuffer),
      branch: state.branch
    };
    if(sha) body.sha = sha;
    const data = await ghFetch(`https://api.github.com/repos/${state.owner}/${state.repo}/contents/${path.split('/').map(encodeURIComponent).join('/')}`, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    if(data.content && data.content.sha){
      state.pathShaMap.set(path, data.content.sha);
      state.pathSet.add(path);
      const base = path.split('/').pop();
      if(!state.basenameMap.has(base)) state.basenameMap.set(base, []);
      if(!state.basenameMap.get(base).includes(path)) state.basenameMap.get(base).push(path);
    }
    updateLogItem(el, (noteExtra?noteExtra+' · ':'') + (sha?'已覆盖更新':'已新建'), 'ok');
    return true;
  }catch(e){
    updateLogItem(el, '失败：' + e.message, 'err');
    return false;
  }finally{
    state.activeUploads--;
  }
}

// 需要用户动手确认的卡片：高亮、加提示条，并自动滚动到屏幕中间，避免被淹没在下方的日志里
function flagNeedsAction(el, label){

  tag.className = 'action-tag';
  tag.textContent = '⚠️ ' + label;
  const body = el.querySelector('.body');
  if(body) body.insertBefore(tag, body.firstChild);
  setTimeout(()=>{ try{ el.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){} }, 60);
}

function showNewFileConfirm(fileName, suggestedPath, arrayBuffer, fileSize){

  const el = document.createElement('div');

  el.id = 'log-' + id;

    ? `<div class="note" style="color:var(--amber);">⚠️ ${formatBytes(fileSize)}，可能超出 GitHub 单文件上传限制（约1MB）</div>`

  el.innerHTML = `<div class="icon">🆕</div>

      <div class="note">仓库里没有同名文件。确认新建路径，要放进新文件夹就在前面加"文件夹名/"：</div>
      ${warnNote}
      <div class="ambiguous">

      </div>
    </div>`;

  const errEl = el.querySelector('.path-error');
  const newInput = el.querySelector('.path-input');
  const newAckRow = el.querySelector('.ack-row');
  const newAck = el.querySelector('.ack-check');
  const newBtn = el.querySelector('.confirm-btn');
  // 手填的路径恰好是仓库里已有的文件：不再静默覆盖，必须勾选确认
  function syncNew(){
    const v = newInput.value.trim().replace(/^\/+/, '');
    const exists = !!v && state.pathSet.has(v);
    newAckRow.style.display = exists ? 'flex' : 'none';
    if(!exists) newAck.checked = false;
    newBtn.disabled = exists && !newAck.checked;
  }
  newInput.addEventListener('input', syncNew);
  newAck.addEventListener('change', syncNew);
  syncNew();
  el.querySelector('.confirm-btn').onclick = ()=>{
    if(newBtn.disabled) return;
    const val = el.querySelector('.path-input').value.trim().replace(/^\/+/, '');

      errEl.textContent = '仓库已切换，这张卡片已失效，请重新选择文件';

      errEl.style.display = 'block';
      return;
    }
    setLastDir(val.includes('/') ? val.slice(0, val.lastIndexOf('/')) : '');

}

function showAmbiguousChoice(baseName, candidates, fallback, arrayBuffer, fileSize){
  const id = 'a' + Math.random().toString(36).slice(2);
  const snap = snapshotRepo();
  const el = document.createElement('div');
  el.className = 'log-item pending';
  el.id = 'log-' + id;
  // 修复：以前下拉框默认选中第一个候选（树里排最前的往往是仓库根目录那份），
  // 不改直接点"确认上传"就覆盖到了根目录。现在：
  //  1) 候选按目录从深到浅排序，根目录的同名文件排最后；
  //  2) 有多个候选时，默认停在"请选择"，不选就不能确认；
  //  3) 只有一个候选，或者之前明确选过某个路径，才会预先选中；
  //  4) 选中根目录文件而别处还有同名文件时，给出醒目提醒。
  const sorted = candidates.slice().sort((x, y) => y.split('/').length - x.split('/').length);
  const remembered = getPick(baseName);
  let preIdx = remembered ? sorted.indexOf(remembered) : -1;
  if(preIdx < 0 && sorted.length === 1) preIdx = 0;
  const options = `<option value="" ${preIdx < 0 ? 'selected' : ''} disabled>— 请选择要覆盖的路径 —</option>`
    + sorted.map((p,i)=>`<option value="${i}" ${i === preIdx ? 'selected' : ''}>${escapeHtml(p)}</option>`).join('');
  const warnNote = (fileSize != null && fileSize > LARGE_FILE_THRESHOLD)
    ? `<div class="note" style="color:var(--amber);">⚠️ ${formatBytes(fileSize)}，可能超出 GitHub 单文件上传限制（约1MB）</div>`
    : '';
  const matchNote = sorted.length > 1
    ? '仓库里有多个同名文件，先选一个完整路径，再确认：'
    : `仓库里已有同名文件（${escapeHtml(sorted[0])}），确认是覆盖它，还是新建一个不相干的文件：`;
  el.innerHTML = `<div class="icon">❓</div>
    <div class="body">
      <div class="path mono">${escapeHtml(baseName)}</div>
      ${repoBannerHtml(snap)}
      <div class="note">${matchNote}</div>
      ${warnNote}
      <div class="ambiguous">
        <select class="path-select mono">
          ${options}
          <option value="new">＋ 都不是，新建于 ${escapeHtml(fallback)}</option>
        </select>
        <input type="text" class="path-input mono new-path" style="display:none;margin-top:8px;" value="${escapeHtml(fallback)}" placeholder="新建路径，例如 app/${escapeHtml(baseName)}">
        <div class="note new-path-hint" style="display:none;">选了"新建"：可以直接改上面的路径，要放进文件夹就写成 文件夹名/${escapeHtml(baseName)}（只写 文件夹名/ 会自动补上文件名）</div>
        <div class="note path-error" style="color:var(--danger);display:none;"></div>
        <div class="note path-warn" style="color:var(--amber);display:none;"></div>
        <label class="ack-row" style="display:flex;align-items:center;gap:6px;margin:8px 0;font-size:13px;cursor:pointer;">
          <input type="checkbox" class="ack-check"> 我确认：覆盖仓库里已有的这个同名文件
        </label>
        <button class="confirm-btn">确认上传</button>
      </div>
    </div>`;
  $('log').prepend(el);
  flagNeedsAction(el, sorted.length > 1 ? '需要你选择：仓库里有多个同名文件，选对路径、勾选“我确认”后才能上传' : '需要你确认：仓库里已有同名文件，勾选“我确认”后才能上传');
  const sel = el.querySelector('.path-select');
  const btn = el.querySelector('.confirm-btn');
  const warnEl = el.querySelector('.path-warn');
  const ackRow = el.querySelector('.ack-row');
  const ack = el.querySelector('.ack-check');
  // 选的是已有文件（会覆盖）→ 必须勾选确认；新建到一个仓库里还不存在的路径 → 不需要
  const newInput = el.querySelector('.new-path');
  const newHint = el.querySelector('.new-path-hint');
  const errEl = el.querySelector('.path-error');
  // 手填路径规整：去首尾空格、反斜杠转斜杠、去开头的"/"；只写了文件夹（以"/"结尾）就自动补文件名
  function newPathValue(){
    let v = newInput.value.trim().replace(/\\/g, '/').replace(/^\/+/, '');
    if(v.endsWith('/')) v += baseName;
    return v;
  }
  function newPathError(){
    const v = newPathValue();
    if(!v) return '路径不能为空';
    if(hasPathTraversal(v)) return '路径不合法（不能包含 ".." 或 "."），改一下再确认';
    return '';
  }
  function needAck(){
    const v = sel.value;
    if(v === '') return true;
    if(v === 'new') return state.pathSet.has(newPathValue());   // 手填的路径恰好是仓库已有文件 → 要勾选确认
    return true;
  }
  function sync(){
    const v = sel.value;
    const isNew = v === 'new';
    newInput.style.display = isNew ? '' : 'none';
    newHint.style.display = isNew ? 'block' : 'none';
    const err = isNew ? newPathError() : '';
    errEl.textContent = err;
    errEl.style.display = err ? 'block' : 'none';
    const need = needAck();
    ackRow.style.display = need ? 'flex' : 'none';
    if(!need) ack.checked = false;
    btn.disabled = (v === '') || !!err || (need && !ack.checked);
    let warn = '';
    if(v === 'new'){
      const np = newPathValue();
      if(!err && state.pathSet.has(np)) warn = '⚠️ 这个路径在仓库里已有同名文件，上传会覆盖它';
      else if(!err && !np.includes('/')) warn = '⚠️ 这会把文件新建在仓库根目录，确认不是放错了位置';
    }else if(v !== ''){
      const p = sorted[parseInt(v,10)];
      const others = sorted.filter(x => x !== p);
      if(!p.includes('/') && others.some(x => x.includes('/'))){
        warn = `⚠️ 你选的是仓库根目录的文件，但子文件夹里还有同名文件（${others.find(x => x.includes('/'))}）。源码一般在子文件夹里，确认没选错`;
      }
    }
    warnEl.textContent = warn;
    warnEl.style.display = warn ? 'block' : 'none';
  }
  // 换了目标路径就要重新确认，避免对着上一个选择勾的"我确认"误传到别的文件
  sel.addEventListener('change', ()=>{
    ack.checked = false;
    if(sel.value === 'new'){ setTimeout(()=>{ try{ newInput.focus(); newInput.select(); }catch(e){} }, 0); }
    sync();
  });
  // 改了路径同样要重新确认，避免对着上一个路径勾的"我确认"误覆盖到别的文件
  newInput.addEventListener('input', ()=>{ ack.checked = false; sync(); });
  ack.addEventListener('change', sync);
  sync();
  btn.onclick = ()=>{
    const v = sel.value;
    if(v === '') return;
    if(needAck() && !ack.checked) return;
    if(!sameRepo(snap)){
      errEl.textContent = '仓库已切换，这张卡片已失效，请重新选择文件';
      errEl.style.display = 'block';
      btn.disabled = true;
      return;
    }
    if(v === 'new' && newPathError()){ sync(); return; }
    el.remove();
    if(v === 'new'){
      const np = newPathValue();
      setLastDir(np.includes('/') ? np.slice(0, np.lastIndexOf('/')) : '');
      uploadOne(np, arrayBuffer, '新建');
    }else{
      const path = sorted[parseInt(v,10)];
      setPick(baseName, path);
      uploadOne(path, arrayBuffer, '手动选择');
    }
  };
}

// ---- 批量处理（压缩包 / 整个文件夹通用）：先解析结构，展示预览，用户确认后才真正上传 ----
// 核心修复点：
// 1) 每个文件的目标路径，完全按"压缩包/文件夹内部的相对路径"决定，
//    不再用"文件名"去仓库全树里反查同名文件——避免不同目录下的同名文件
//    （比如根目录 build.gradle 和 app/build.gradle）互相认成同一个目标、
//    彼此覆盖。
// 2) 自动识别是否包多出一层外壳文件夹（比如所有文件都在
//    "项目名/"下面，或者就是你选中的那个文件夹本身），可以选择去掉这层，
//    让内容直接摊平到仓库根目录，也可以选择保留，原样对应仓库里的子文件夹。
// 3) 上传前先显示完整的目标路径列表，人工确认无误后再一次性提交，
//    不会出现"传完了才发现路径错了"的情况。
// 4) 自动过滤系统垃圾文件（__MACOSX、.DS_Store、Thumbs.db、AppleDouble ._*）——
//    压缩包和文件夹（尤其是 Mac 上选的文件夹）都常见这类文件。
// 5) 拦截路径穿越条目（包含 ".." 或以 "/" 开头的路径），不允许上传。
// 6) 对超过 1MB 的文件给出警告（GitHub Contents API 对单文件大小有限制，
//    超过 1MB 大概率会返回错误），并默认不勾选常见的构建产物/依赖缓存目录
//    （node_modules、build、.gradle、.idea、dist、out、target），
//    避免手滑把整个构建缓存也传进仓库。
// 7) 上传结束后给出批量结果汇总（成功/失败各多少个）。
// 8) 压缩包（handleZipFile）和整个文件夹（handleFolderFiles）走同一套
//    预览/确认/上传逻辑（prepareBatch / renderBatchPreview），行为完全一致。
//    单个/多个零散文件（不经过文件夹或压缩包选择）走 handleFiles 里原有的
//    "按文件名智能匹配"流程，但也补上了系统垃圾文件过滤、大文件警告、
//    手填路径的穿越校验，以及处理完成后的批量汇总。
// 10) 单个文件的同名保护：单个文件没有路径信息，只能按文件名去仓库里猜，容易覆盖错位置，所以
//    - 仓库里有同名文件时，确认框里多一个"我确认覆盖"勾选，不勾选"确认上传"按钮是灰的；
//    - 手填路径恰好撞上已有文件时，同样要勾选确认。
//    压缩包/文件夹/拖放自带完整路径，"同名不同路径"本来就是不同文件，不受这条限制。
// 9) 压缩包/文件夹/拖放只有一个最外层文件夹时，"要不要去掉这层"不再一律默认去掉，
//    而是看仓库里已有的内容来自动判断（decideStrip）：
//    - 按原路径能对上的已有文件更多 → 保留这层（例如只含 app/ 的更新包，仓库里本来就有 app/）
//    - 去掉这层后能对上的更多 → 去掉（例如整个项目外面套了一层文件夹）
//    - 都对不上 → 仅当像典型外壳（xxx-main、和压缩包/仓库同名、里面有多个项目根文件）才去掉
//    判断依据会显示在预览里，勾选框仍可手动改。

const JUNK_PATTERNS = [
  /(^|\/)__MACOSX(\/|$)/,
  /(^|\/)\.DS_Store$/,
  /(^|\/)Thumbs\.db$/i,
  /(^|\/)\._[^\/]+$/, // AppleDouble 资源叉文件
];
const HEAVY_DIR_PATTERN = /(^|\/)(node_modules|build|\.gradle|\.idea|dist|out|target)(\/|$)/i;
const LARGE_FILE_THRESHOLD = 1000 * 1000; // ~1MB，GitHub Contents API 单文件上限附近

function isJunkPath(p){
  return JUNK_PATTERNS.some(re => re.test(p));
}
function hasPathTraversal(p){
  return p.split('/').some(seg => seg === '..' || seg === '.') || p.startsWith('/');
}
function formatBytes(n){
  if(n == null) return '';
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return (n/1024).toFixed(1) + ' KB';
  return (n/1024/1024).toFixed(2) + ' MB';
}
function entrySize(entry){
  // JSZip 没有正式公开的 size 属性，退而求其次读内部字段，读不到就返回 null（不影响功能，只是不显示大小/不做大文件预警）
  try{ return entry._data ? entry._data.uncompressedSize : null; }catch(e){ return null; }
}

// 检测唯一的顶层外壳文件夹：所有条目的第一层目录名都相同，且都带这层目录
function detectSingleTop(items){
  const tops = new Set(items.map(i=>i.name.split('/')[0]));
  const allNested = items.every(i=>i.name.includes('/'));
  return (tops.size === 1 && allNested) ? [...tops][0] : null;
}

// 项目根目录里常见的标志文件：去掉外壳后，如果有多个这类文件落在根目录，说明那层确实是外壳
const ROOT_MARKER_PATTERN = /^(settings\.gradle(\.kts)?|build\.gradle(\.kts)?|gradle\.properties|package\.json|pom\.xml|Cargo\.toml|go\.mod|pyproject\.toml|requirements\.txt|Dockerfile|README(\.md)?|index\.html|\.gitignore|\.github\/.+)$/i;

// 根据仓库里已有的内容，判断单一顶层文件夹到底是"外壳"（该去掉）还是"真实目录"（该保留）
function decideStrip(items, singleTop, batchName){
  if(!singleTop) return {strip:false, reason:''};
  const prefix = singleTop + '/';
  let asIs = 0, stripped = 0, markers = 0;
  for(const i of items){
    if(state.pathSet.has(i.name)) asIs++;
    const s = i.name.slice(prefix.length);
    if(s && state.pathSet.has(s)) stripped++;
    if(s && ROOT_MARKER_PATTERN.test(s)) markers++;
  }
  if(asIs > stripped){
    return {strip:false, reason:`仓库里已有「${singleTop}/」目录，按原路径能对上 ${asIs} 个已有文件（去掉这层只能对上 ${stripped} 个），所以保留这层目录，不去掉。`};
  }
  if(stripped > asIs){
    return {strip:true, reason:`去掉这层后能对上 ${stripped} 个仓库已有文件（保留只能对上 ${asIs} 个），所以判断它是外壳，已默认去掉。`};
  }
  // 两种都对不上（或一样多）：看仓库里有没有这个目录，再看像不像典型外壳
  let repoHasTop = false;
  for(const p of state.pathSet){ if(p.startsWith(prefix)){ repoHasTop = true; break; } }
  if(repoHasTop){
    return {strip:false, reason:`仓库里已有「${singleTop}/」目录，保留这层目录，文件会放进去。`};
  }
  const zipBase = String(batchName || '').replace(/\.zip$/i, '');
  const looksWrapper = /-(main|master)$/i.test(singleTop)
    || singleTop === zipBase
    || singleTop.toLowerCase() === String(state.repo || '').toLowerCase()
    || markers >= 2;
  if(looksWrapper){
    return {strip:true, reason:`仓库里没有「${singleTop}/」目录，而且它像压缩包的外壳文件夹，已默认去掉。`};
  }
  return {strip:false, reason:`仓库里没有「${singleTop}/」目录，也不像外壳文件夹，所以保留这层目录（文件会放进「${singleTop}/」里）。如果它其实是外壳，请勾选下面的选项。`};
}

// items: [{name, size, getData:()=>Promise<ArrayBuffer>}]
// 把"压缩包/文件夹里的文件"和"仓库里同路径的文件"按 git blob sha 比对，
// 内容完全一样的标为"无变化"，预览里默认不勾选，不会重复上传。
async function hashExistingItems(items, singleTop){
  const need = items.filter(i=>{
    if(HEAVY_DIR_PATTERN.test(i.name)) return false;
    if(state.pathSet.has(i.name)) return true;
    return !!singleTop && state.pathSet.has(i.name.slice(singleTop.length + 1));
  });
  if(!need.length) return;
  const el = addLogItem('h'+Math.random(), '正在比对', `正在和仓库里已有的 ${need.length} 个同路径文件比对内容…`, 'pending');
  for(const i of need){
    try{ i.sha = await gitBlobSha1(await i.getData()); }catch(e){ i.sha = null; }
  }
  el.remove();
}

async function prepareBatch(batchName, rawItems, icon, sourceLabel){
  const junkCount = rawItems.filter(i => isJunkPath(i.name)).length;
  const items = rawItems.filter(i => !isJunkPath(i.name));
  if(items.length === 0){
    const msg = junkCount > 0 ? `${sourceLabel}内除系统垃圾文件外没有其他内容` : `${sourceLabel}内没有文件`;
    addLogItem('b'+Math.random(), batchName, msg, 'err');
    return;
  }
  const snap = snapshotRepo();
  const singleTop = detectSingleTop(items);
  await hashExistingItems(items, singleTop);
  if(!sameRepo(snap)){
    addLogItem('b'+Math.random(), batchName, '处理期间仓库被切换了，这个包的预览已作废，请重新选择', 'err');
    return;
  }
  const stripInfo = decideStrip(items, singleTop, batchName);
  const overlap = computeOverlap(items, singleTop);
  renderBatchPreview(batchName, items, singleTop, junkCount, icon, sourceLabel, stripInfo, snap, overlap);
}

async function handleZipFile(file){
  let zip, rawEntries;
  try{
    const buf = await file.arrayBuffer();
    zip = await JSZip.loadAsync(buf);
    rawEntries = Object.values(zip.files).filter(e=>!e.dir);
  }catch(e){
    addLogItem('z'+Math.random(), file.name, '压缩包处理失败：' + e.message, 'err');
    return;
  }
  if(rawEntries.length === 0){
    addLogItem('z'+Math.random(), file.name, '压缩包内没有文件', 'err');
    return;
  }
  const items = rawEntries.map(e => ({
    name: e.name,
    size: entrySize(e),
    getData: () => e.async('arraybuffer')
  }));
  prepareBatch(file.name, items, '📦', '压缩包');
}

async function handleFolderFiles(fileList){
  const files = Array.from(fileList).filter(f => f.webkitRelativePath);
  if(files.length === 0){
    addLogItem('f'+Math.random(), '文件夹', '没有读取到文件夹内容', 'err');
    return;
  }
  const folderLabel = files[0].webkitRelativePath.split('/')[0] || '文件夹';
  const items = files.map(f => ({
    name: f.webkitRelativePath,
    size: f.size,
    getData: () => f.arrayBuffer()
  }));
  prepareBatch(folderLabel, items, '📁', '文件夹');
}

// ---- 拖放支持：可以一次拖进多个文件夹 + 多个零散文件混在一起 ----
// 原生的"选择文件夹"输入框一次只能选一个文件夹（这是操作系统选择器的限制，
// 不是本工具的限制）。要一次处理多个文件夹，用拖放：桌面浏览器的拖放支持
// 一次性读取多个文件夹和文件的完整目录结构。
function readEntryAsFile(entry){
  return new Promise((resolve, reject)=> entry.file(resolve, reject));
}
function readAllDirEntries(dirReader){
  return new Promise((resolve, reject)=>{
    let all = [];
    (function readBatch(){
      dirReader.readEntries(batch=>{
        if(!batch.length){ resolve(all); return; }
        all = all.concat(batch);
        readBatch();
      }, reject);
    })();
  });
}
async function collectEntryFiles(entry, out){
  if(entry.isFile){
    const file = await readEntryAsFile(entry);
    out.push({
      name: entry.fullPath.replace(/^\//, ''),
      size: file.size,
      getData: () => file.arrayBuffer()
    });
  }else if(entry.isDirectory){
    const entries = await readAllDirEntries(entry.createReader());
    for(const child of entries){
      await collectEntryFiles(child, out);
    }
  }
}
async function handleDataTransfer(dataTransfer){
  if(!dataTransfer) return;
  const items = Array.from(dataTransfer.items || []);
  const canUseEntries = items.length && typeof items[0].webkitGetAsEntry === 'function';
  if(!canUseEntries){
    // 不支持目录读取的环境（比如部分移动浏览器）：退化为普通文件列表
    if(dataTransfer.files && dataTransfer.files.length) await handleFiles(dataTransfer.files);
    return;
  }
  const entries = items.map(it => it.webkitGetAsEntry()).filter(Boolean);
  if(entries.length === 0) return;
  const anyDir = entries.some(e => e.isDirectory);
  if(!anyDir){
    // 全是零散文件，没有文件夹：走原来的按文件名智能匹配流程
    if(dataTransfer.files && dataTransfer.files.length) await handleFiles(dataTransfer.files);
    return;
  }
  // 含至少一个文件夹：统一走批量预览流程，支持同时拖进多个文件夹/文件
  const out = [];
  for(const entry of entries){
    await collectEntryFiles(entry, out);
  }
  if(out.length === 0){
    addLogItem('d'+Math.random(), '拖放内容', '没有读取到文件', 'err');
    return;
  }
  const label = entries.length === 1 ? (entries[0].name || '文件夹') : `拖放的 ${entries.length} 项`;
  prepareBatch(label, out, '📁', '拖放内容');
}

function computeBatchTargets(items, singleTop, strip){
  return items.map(item=>{
    let p = item.name;
    if(strip && singleTop){
      p = p.slice(singleTop.length + 1);
    }
    const invalid = hasPathTraversal(p) || !p;
    const size = item.size;
    const heavy = HEAVY_DIR_PATTERN.test(p);
    const large = size != null && size > LARGE_FILE_THRESHOLD;
    const exists0 = !invalid && state.pathSet.has(p);
    const unchanged = exists0 && !!item.sha && item.sha === state.pathShaMap.get(p);
    return {
      item,
      path:p,
      exists: !invalid && state.pathSet.has(p),
      invalid,
      size,
      heavy,
      large,
      unchanged,
      // 默认勾选：路径合法，不是疑似构建产物/依赖缓存目录，且内容和仓库里的不一样
      defaultChecked: !invalid && !heavy && !unchanged
    };
  });
}

function renderBatchPreview(batchName, items, singleTop, junkCount, icon, sourceLabel, stripInfo, snap, overlap){
  const repoLabel = `${snap.owner}/${snap.repo}`;
  const color = repoColor(repoLabel);
  // 路径一个都对不上，按情况分三档：
  //  - 仓库 ≥20 个文件且文件名也对不上 → 红色拦截，必须勾选确认
  //  - 文件名能对上（只是目录层级不同）→ 黄色提示，不拦截
  //  - 仓库只有 1~19 个文件 → 黄色提示（可能只是往小仓库加新文件），不拦截
  //  - 仓库为空 → 不提示
  const repoSize = state.pathSet.size;
  const zeroOverlap = repoSize >= 1 && overlap.total > 0 && overlap.best === 0;
  const mismatch = zeroOverlap && repoSize >= 20 && overlap.nameMatch === 0;
  const softNotice = zeroOverlap && !mismatch;
  const softHtml = softNotice
    ? `<div style="margin:8px 0;padding:9px 12px;border:2px solid var(--amber);border-radius:10px;background:color-mix(in srgb, var(--amber) 12%, var(--card));font-size:13px;">${
        overlap.nameMatch > 0
          ? `⚠️ 包里的路径和仓库一个都对不上，但有 ${overlap.nameMatch} 个文件名能对上（例如 <span class="mono">${escapeHtml(overlap.nameExample)}</span>）。仓库大概率没选错，只是目录层级不同：上传会<b>新建</b>而不是覆盖，请检查下面的路径，必要时勾选/取消“去掉最外层文件夹”`
          : `⚠️ 包里的 ${overlap.total} 个文件和当前仓库（共 ${repoSize} 个文件）一个都对不上。如果是往这个仓库新增文件就没问题，否则请确认没选错仓库`
      }</div>`
    : '';
  const mismatchHtml = mismatch
    ? `<div style="margin:8px 0;padding:10px 12px;border:2px solid var(--danger);border-radius:10px;background:color-mix(in srgb, var(--danger) 10%, var(--card));font-size:13px;">
         <div style="font-weight:700;color:var(--danger);margin-bottom:6px;">🚫 这个包和当前仓库几乎没有重合文件，可能选错仓库了</div>
         <div class="note">当前仓库已有 ${repoSize} 个文件，而这 ${overlap.total} 个文件里没有一个能按路径或文件名对上（去掉外壳文件夹后也对不上）。</div>
         <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;cursor:pointer;">
           <input type="checkbox" class="mismatch-ack"> 我确认就是传到 ${escapeHtml(repoLabel)}
         </label>
       </div>`
    : '';
  // 上次这个包传到了别的仓库 → 黄色提醒
  const rememberedRepo = /^拖放的 /.test(batchName) ? '' : getZipRepo(batchName);
  const rememberedHtml = (rememberedRepo && rememberedRepo !== repoLabel)
    ? `<div style="margin:8px 0;padding:9px 12px;border:2px solid var(--amber);border-radius:10px;background:color-mix(in srgb, var(--amber) 12%, var(--card));font-size:13px;">⚠️ 上次「${escapeHtml(batchName)}」传到的是 <b class="mono">${escapeHtml(rememberedRepo)}</b>，这次要传到 <b class="mono">${escapeHtml(repoLabel)}</b>，确认没选错仓库</div>`
    : '';
  const id = 'bp' + Math.random().toString(36).slice(2);
  const el = document.createElement('div');
  el.className = 'log-item pending';
  el.id = 'log-' + id;

  const renderList = (targets) => targets.map((t, idx)=>{
    if(t.invalid){
      return `<div class="path mono" style="margin-top:4px;color:var(--danger);">
        ⛔ 路径不合法，已跳过（不会上传） — ${escapeHtml(t.path || '(空路径)')}
      </div>`;
    }
    const tags = [];
    tags.push(t.unchanged ? '⏭️无变化' : (t.exists ? '📝覆盖' : '🆕新建'));
    if(t.heavy) tags.push('⚠️疑似构建产物/缓存目录');
    if(t.large) tags.push(`⚠️${formatBytes(t.size)}，可能超出GitHub单文件上传限制`);
    const sizeStr = t.size != null ? `<span style="opacity:.6;"> (${formatBytes(t.size)})</span>` : '';
    return `<label style="display:flex;align-items:flex-start;gap:6px;margin-top:6px;cursor:pointer;${t.unchanged ? 'opacity:.55;' : ''}">
      <input type="checkbox" class="target-check" data-idx="${idx}" ${t.defaultChecked ? 'checked' : ''} style="margin-top:3px;">
      <span class="path mono">${tags.join(' ')} — ${escapeHtml(t.path)}${sizeStr}</span>
    </label>`;
  }).join('');

  const stripCheckboxHtml = singleTop
    ? `<label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-soft);margin:8px 0;">
         <input type="checkbox" class="strip-top" ${stripInfo && stripInfo.strip ? 'checked' : ''}>
         检测到最外层文件夹「${escapeHtml(singleTop)}/」，去掉这层，内容直接放到目标目录下
       </label>
       <div class="note" style="margin:-4px 0 8px;">${escapeHtml(stripInfo ? stripInfo.reason : '')}</div>`
    : '';

  const junkNote = junkCount > 0
    ? `<div class="note">已自动跳过 ${junkCount} 个系统垃圾文件（__MACOSX / .DS_Store / Thumbs.db 等）</div>`
    : '';

  el.innerHTML = `<div class="icon">${icon}</div>
    <div class="body">
      <div class="path mono">${escapeHtml(batchName)}</div>
      ${repoBannerHtml(snap)}
      ${mismatchHtml}
      ${softHtml}
      ${rememberedHtml}
      <div class="note">${sourceLabel}内共 ${items.length} 个文件，确认下面的目标路径无误后再上传：</div>
      ${junkNote}
      ${stripCheckboxHtml}
      <div class="note" style="margin-top:6px;">未勾选的行不会上传（默认不勾选：内容和仓库里完全一样的、疑似构建产物/缓存目录、路径不合法的）：</div>
      <div class="note unchanged-note" style="margin-top:4px;font-weight:600;"></div>
      <div class="zip-target-list"></div>
      <div class="ambiguous">
        <div class="note stale-note" style="color:var(--danger);font-weight:700;display:none;margin-bottom:8px;"></div>
        <button class="confirm-btn confirm-batch">确认上传已勾选的文件</button>
        <button class="ghost cancel-batch" style="margin-top:8px;">取消</button>
      </div>
    </div>`;
  $('log').prepend(el);
  flagNeedsAction(el, '需要你确认：检查下面的目标路径，再点“确认上传”');
  el.style.borderLeft = `6px solid ${color}`;  // 仓库专属颜色，和顶部标签一致

  const listEl = el.querySelector('.zip-target-list');
  const checkbox = el.querySelector('.strip-top');
  const confirmBtn = el.querySelector('.confirm-batch');
  let currentTargets = [];
  let checkedState = []; // 与 currentTargets 下标对应的 boolean 数组

  function countChecked(){
    return checkedState.filter(Boolean).length;
  }
  const mismatchAck = el.querySelector('.mismatch-ack');
  function updateConfirmLabel(){
    const n = countChecked();
    const needAck = mismatch && !(mismatchAck && mismatchAck.checked);
    confirmBtn.textContent = n === 0
      ? '没有需要上传的文件（没有勾选）'
      : (needAck ? `请先勾选上方“我确认就是传到 ${repoLabel}”` : `确认上传已勾选的 ${n} 个文件到 ${repoLabel}`);
    confirmBtn.disabled = n === 0 || needAck;
  }
  if(mismatchAck) mismatchAck.addEventListener('change', updateConfirmLabel);

  function refresh(){
    currentTargets = computeBatchTargets(items, singleTop, checkbox ? checkbox.checked : false);
    checkedState = currentTargets.map(t => t.defaultChecked);
    listEl.innerHTML = renderList(currentTargets);
    const nUnchanged = currentTargets.filter(t => t.unchanged).length;
    el.querySelector('.unchanged-note').textContent = nUnchanged
      ? `其中 ${nUnchanged} 个和仓库里的内容完全一样（标「⏭️无变化」），已默认取消勾选，不会重复上传；其余 ${currentTargets.length - nUnchanged} 个有变化或是新文件`
      : '';
    updateConfirmLabel();
  }
  refresh();
  if(checkbox) checkbox.addEventListener('change', refresh);

  listEl.addEventListener('change', (ev)=>{
    if(ev.target.classList.contains('target-check')){
      const idx = parseInt(ev.target.dataset.idx, 10);
      checkedState[idx] = ev.target.checked;
      updateConfirmLabel();
    }
  });

  el.querySelector('.cancel-batch').onclick = () => el.remove();

  confirmBtn.onclick = async () => {
    // 确认时仓库已经不是预览时的那个 → 拒绝上传
    if(!sameRepo(snap)){
      const stale = el.querySelector('.stale-note');
      stale.textContent = `仓库已切换（预览是按 ${repoLabel} 算的），不能上传。请重新选择压缩包/文件夹`;
      stale.style.display = 'block';
      confirmBtn.disabled = true;
      return;
    }
    const toUpload = currentTargets.filter((t, idx) => checkedState[idx] && !t.invalid);
    el.remove();
    let okCount = 0, failCount = 0, aborted = false;
    for(const t of toUpload){
      if(!sameRepo(snap)){ aborted = true; break; }
      const content = await t.item.getData();
      // 读文件期间也可能被切换仓库，上传前再确认一次
      if(!sameRepo(snap)){ aborted = true; break; }
      const note = t.exists ? `覆盖（${sourceLabel}结构确认）` : `新建（${sourceLabel}结构确认）`;
      const ok = await uploadOne(t.path, content, note);
      if(ok) okCount++; else failCount++;
    }
    if(okCount > 0 && !/^拖放的 /.test(batchName)) setZipRepo(batchName, repoLabel);
    const cls = (failCount === 0 && !aborted) ? 'ok' : 'err';
    let summary;
    if(aborted){
      const left = toUpload.length - okCount - failCount;
      summary = `已中止：上传中途仓库被切换。已传到 ${repoLabel} ${okCount} 个，${failCount} 个失败，剩余 ${left} 个没有上传`;
    }else{
      summary = failCount === 0
        ? `批量上传完成：${okCount} 个全部成功（${repoLabel}）`
        : `批量上传完成：${okCount} 个成功，${failCount} 个失败（失败原因见上方对应记录）`;
    }
    addLogItem('sum'+Math.random(), batchName, summary, cls, 'summary');
  };
}


async function handleFiles(fileList){
  $('uploadStatus').textContent = '正在处理…';
  $('uploadStatus').style.color = ''; $('uploadStatus').style.fontWeight = ''; $('uploadStatus').style.fontSize = '';
  const files = Array.from(fileList);
  let skippedJunk = 0, autoOk = 0, autoFail = 0, pending = 0;
  for(const file of files){
    if(/\.zip$/i.test(file.name)){
      await handleZipFile(file);
      continue;
    }
    if(isJunkPath(file.name)){
      skippedJunk++;
      continue;
    }
    const content = await file.arrayBuffer();
    const target = resolveTarget(null, file.name);
    if(target.type === 'ambiguous'){
      pending++;
      showAmbiguousChoice(file.name, target.candidates, target.fallback, content, file.size);
    }else if(target.type === 'new'){
      pending++;
      showNewFileConfirm(file.name, target.path, content, file.size);
    }else{
      // 仓库里只有一个同名文件 = 正常更新，直接覆盖；有 2 个以上同名才需要选（上面的 ambiguous 分支）
      const sizeNote = file.size > LARGE_FILE_THRESHOLD ? `（⚠️${formatBytes(file.size)}，注意GitHub单文件上传限制）` : '';
      const ok = await uploadOne(target.path, content, '按文件名匹配到仓库路径' + sizeNote);
      if(ok) autoOk++; else autoFail++;
    }
  }
  const parts = [];
  if(autoOk) parts.push(`${autoOk} 个已上传`);
  if(autoFail) parts.push(`${autoFail} 个失败`);
  if(pending) parts.push(`${pending} 个待你确认路径`);
  if(skippedJunk) parts.push(`${skippedJunk} 个系统垃圾文件已跳过`);
  $('uploadStatus').textContent = parts.length ? '处理完成：' + parts.join('，') : '处理完成';
  $('uploadStatus').style.color = pending ? 'var(--amber)' : '';
  $('uploadStatus').style.fontWeight = pending ? '700' : '';
  $('uploadStatus').style.fontSize = pending ? '14px' : '';
}

$('fileInput').addEventListener('change', e=>{
  if(e.target.files && e.target.files.length){
    handleFiles(e.target.files);
    e.target.value = '';
  }
});

$('folderInput').addEventListener('change', e=>{
  if(e.target.files && e.target.files.length){
    const hasRelPath = Array.from(e.target.files).some(f => f.webkitRelativePath);
    if(hasRelPath){
      handleFolderFiles(e.target.files);
    }else{
      // 设备不支持文件夹目录结构（比如部分移动端浏览器），退化为按单个文件处理
      handleFiles(e.target.files);
    }
    e.target.value = '';
  }
});

// 拖放：桌面浏览器下可以一次拖进多个文件夹和文件的混合内容
const dropZoneEl = $('dropZone');
['dragenter','dragover'].forEach(evt=>{
  dropZoneEl.addEventListener(evt, e=>{ e.preventDefault(); dropZoneEl.classList.add('hover'); });
});
['dragleave','dragend'].forEach(evt=>{
  dropZoneEl.addEventListener(evt, e=>{ dropZoneEl.classList.remove('hover'); });
});
dropZoneEl.addEventListener('drop', e=>{
  e.preventDefault();
  dropZoneEl.classList.remove('hover');
  handleDataTransfer(e.dataTransfer);
});

// 意外刷新/关闭页面保护：有上传正在进行、或者有待确认的卡片还没处理时提示一下
window.addEventListener('beforeunload', (e)=>{
  const busy = state.activeUploads > 0 || !!document.querySelector('#log .log-item.pending');
  if(busy){
    e.preventDefault();
    e.returnValue = '';
  }
});

// 初始化
(function init(){
  if(loadSettings()){
    fetchTree().then(()=>{
      $('uploadCard').classList.remove('hidden');
      $('logCard').classList.remove('hidden');
      $('settingsCard').classList.add('hidden');
      updateRepoTag();
    }).catch(e=>{
      showSettings();
      $('settingsStatus').textContent = '自动连接失败：' + e.message;
      $('settingsStatus').style.color = 'var(--danger)';
    });
  }else{
    showSettings();
  }
})();
